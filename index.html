<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Иконки для Clash — RAW + CDN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 2rem;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        h1 { font-size: 1.8rem; display: flex; align-items: center; gap: 0.5rem; }
        h1 small { font-size: 0.9rem; font-weight: 400; color: #8b949e; background: #161b22; padding: 0.2rem 0.8rem; border-radius: 20px; border: 1px solid #30363d; }
        .search-box input {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #161b22;
            color: #c9d1d9;
            font-size: 0.95rem;
            outline: none;
            width: 250px;
        }
        .search-box input:focus { border-color: #58a6ff; }
        .search-box input::placeholder { color: #484f58; }
        .stats { text-align: center; margin-bottom: 1.5rem; color: #8b949e; }
        .stats span { background: #161b22; padding: 0.3rem 1rem; border-radius: 20px; border: 1px solid #30363d; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .icon-card {
            background: #161b22;
            border-radius: 12px;
            padding: 1.5rem 1rem;
            text-align: center;
            border: 1px solid #30363d;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .icon-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border-color: #7c5cfc;
        }
        .icon-card img {
            width: 100%;
            max-height: 140px;
            object-fit: contain;
            background: #0d1117;
            border-radius: 8px;
            padding: 8px;
        }
        .icon-card .name {
            margin-top: 0.75rem;
            font-size: 0.9rem;
            color: #8b949e;
            word-break: break-all;
            font-weight: 500;
        }
        .link-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .link-btn {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            border: none;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .link-btn:hover { opacity: 0.85; transform: scale(0.97); }
        .link-btn.raw { background: #238636; color: #fff; }
        .link-btn.cdn { background: #7c5cfc; color: #fff; }
        .badge-type {
            display: inline-block;
            margin-top: 0.3rem;
            font-size: 0.6rem;
            color: #484f58;
            background: #161b22;
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #161b22;
            border: 1px solid #30363d;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 1000;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: #238636; }
        .toast.error { border-color: #f85149; }
        .loader {
            text-align: center;
            padding: 3rem;
            color: #8b949e;
            grid-column: 1 / -1;
        }
        .loader::after {
            content: '⏳';
            display: block;
            font-size: 2rem;
            margin-top: 0.5rem;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .error {
            color: #f85149;
            text-align: center;
            grid-column: 1 / -1;
            padding: 2rem;
        }
        .error button {
            background: #7c5cfc;
            color: #fff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
        }
        .error button:hover { opacity: 0.9; }
        .footer-note {
            text-align: center;
            margin-top: 2.5rem;
            font-size: 0.85rem;
            color: #484f58;
            border-top: 1px solid #30363d;
            padding-top: 1.5rem;
        }
        .footer-note .clash-tip { color: #7c5cfc; font-weight: 500; }
        @media (max-width: 600px) {
            body { padding: 1rem; }
            .header { flex-direction: column; align-items: stretch; }
            .header-controls { justify-content: space-between; }
            .search-box input { width: 100%; }
            .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
            .icon-card img { max-height: 100px; }
            .link-btn { font-size: 0.6rem; padding: 0.2rem 0.6rem; }
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0d1117; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #484f58; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚀 Иконки для Clash <small>RAW + CDN</small></h1>
        <div class="header-controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Поиск..." oninput="filterIcons()">
            </div>
        </div>
    </div>

    <div class="stats">
        📦 <span id="countDisplay">0</span> иконок
    </div>

    <div class="gallery" id="gallery">
        <div class="loader">⏳ Загрузка иконок...</div>
    </div>

    <div id="toast" class="toast">✅ Скопировано!</div>

    <div class="footer-note">
        ⚡ Нажмите <strong>RAW</strong> или <strong>CDN</strong> чтобы скопировать ссылку для Clash
        <span class="clash-tip">(вставьте в поле «URL иконки»)</span>
    </div>

    <script>
        // ============================================================
        // НАСТРОЙКИ — ИЗМЕНИТЕ ПОД СЕБЯ
        // ============================================================
        const REPO_OWNER = 'BloodWolfik';
        const REPO_NAME = 'Sites';
        const BRANCH = 'main';
        const ICONS_PATH = 'icons';
        const ALLOWED_EXTENSIONS = ['.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp', '.ico'];
        const CACHE_KEY = 'clash_icons_cache';
        const CACHE_TIMESTAMP_KEY = 'clash_icons_timestamp';
        const CACHE_DURATION = 30 * 60 * 1000; // 30 минут

        // ============================================================
        // СОСТОЯНИЕ
        // ============================================================
        const gallery = document.getElementById('gallery');
        const toast = document.getElementById('toast');
        const countDisplay = document.getElementById('countDisplay');
        const searchInput = document.getElementById('searchInput');

        let allIcons = [];

        // ============================================================
        // РАБОТА С КЕШЕМ
        // ============================================================
        function getCachedIcons() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                const timestamp = localStorage.getItem(CACHE_TIMESTAMP_KEY);
                if (!cached || !timestamp) return null;
                if (Date.now() - parseInt(timestamp) > CACHE_DURATION) {
                    localStorage.removeItem(CACHE_KEY);
                    localStorage.removeItem(CACHE_TIMESTAMP_KEY);
                    return null;
                }
                return JSON.parse(cached);
            } catch {
                return null;
            }
        }

        function saveToCache(icons) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(icons));
                localStorage.setItem(CACHE_TIMESTAMP_KEY, String(Date.now()));
            } catch (e) {
                console.warn('Не удалось сохранить кеш:', e);
            }
        }

        // ============================================================
        // ФОРМИРОВАНИЕ ССЫЛОК
        // ============================================================
        function buildUrls(filePath) {
            const raw = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${filePath}`;
            const cdn = `https://cdn.jsdelivr.net/gh/${REPO_OWNER}/${REPO_NAME}@${BRANCH}/${filePath}`;
            return { raw, cdn };
        }

        // ============================================================
        // ЗАГРУЗКА С КЕШЕМ
        // ============================================================
        async function loadIcons() {
            // 1. Пытаемся загрузить из кеша
            const cached = getCachedIcons();
            if (cached && cached.length > 0) {
                allIcons = cached;
                renderIcons(allIcons);
                // Показываем, что данные из кеша
                showToast('📦 Иконки загружены из кеша', 'success');
                // Фоново обновляем, если кеш скоро истечёт
                const timestamp = parseInt(localStorage.getItem(CACHE_TIMESTAMP_KEY) || '0');
                if (Date.now() - timestamp > CACHE_DURATION / 2) {
                    fetchIconsFromGitHub(true); // тихое обновление
                }
                return;
            }

            // 2. Если кеша нет — грузим с GitHub
            await fetchIconsFromGitHub(false);
        }

        async function fetchIconsFromGitHub(silent = false) {
            try {
                const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${ICONS_PATH}?ref=${BRANCH}`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    if (response.status === 403) {
                        // Если лимит исчерпан и кеша нет — показываем ошибку
                        if (!silent) {
                            gallery.innerHTML = `
                                <div class="error">
                                    ⚠️ Превышен лимит запросов к GitHub API<br>
                                    <small style="color: #8b949e;">Подождите 15-20 минут или используйте кеш</small>
                                    <br>
                                    <button onclick="loadIcons()">Попробовать снова</button>
                                </div>
                            `;
                        }
                        return;
                    }
                    throw new Error(`Ошибка API: ${response.status}`);
                }

                const files = await response.json();

                const imageFiles = files.filter(file => {
                    if (file.type !== 'file') return false;
                    const ext = '.' + file.name.split('.').pop().toLowerCase();
                    return ALLOWED_EXTENSIONS.includes(ext);
                });

                if (imageFiles.length === 0) {
                    gallery.innerHTML = `<div class="error">😕 В папке "${ICONS_PATH}" нет изображений</div>`;
                    return;
                }

                allIcons = imageFiles.map(file => {
                    const name = file.name.replace(/\.[^.]+$/, '');
                    const urls = buildUrls(file.path);
                    return { name, raw: urls.raw, cdn: urls.cdn };
                });

                // Сохраняем в кеш
                saveToCache(allIcons);

                renderIcons(allIcons);
                if (!silent) {
                    showToast('✅ Иконки загружены с GitHub', 'success');
                }

            } catch (error) {
                console.error('Ошибка загрузки:', error);
                if (!silent) {
                    gallery.innerHTML = `
                        <div class="error">
                            ❌ ${error.message}<br>
                            <button onclick="loadIcons()">Повторить</button>
                        </div>
                    `;
                }
            }
        }

        // ============================================================
        // ОТРИСОВКА
        // ============================================================
        function renderIcons(icons) {
            gallery.innerHTML = '';
            if (icons.length === 0) {
                gallery.innerHTML = `
                    <div style="grid-column:1/-1;text-align:center;color:#8b949e;padding:3rem;">
                        😕 Ничего не найдено
                    </div>
                `;
                countDisplay.textContent = '0';
                return;
            }

            icons.forEach(icon => {
                const card = document.createElement('div');
                card.className = 'icon-card';

                card.innerHTML = `
                    <img src="${icon.raw}" alt="${icon.name}" loading="lazy" 
                         onerror="this.style.display='none'">
                    <div class="name">${icon.name}</div>
                    <div class="link-buttons">
                        <button class="link-btn raw" data-url="${icon.raw}" data-name="${icon.name}">⬇ RAW</button>
                        <button class="link-btn cdn" data-url="${icon.cdn}" data-name="${icon.name}">🌐 CDN</button>
                    </div>
                    <div class="badge-type">⚡ Clash</div>
                `;

                card.querySelectorAll('.link-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const url = btn.dataset.url;
                        const name = btn.dataset.name;
                        const type = btn.classList.contains('cdn') ? 'CDN' : 'RAW';
                        copyToClipboard(url, `${name} (${type})`);
                    });
                });

                card.addEventListener('click', () => {
                    copyToClipboard(icon.raw, `${icon.name} (RAW)`);
                });

                gallery.appendChild(card);
            });

            countDisplay.textContent = icons.length;
        }

        // ============================================================
        // КОПИРОВАНИЕ
        // ============================================================
        function copyToClipboard(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`✅ ${label} — скопировано!`, 'success');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                try {
                    document.execCommand('copy');
                    showToast(`✅ ${label} — скопировано!`, 'success');
                } catch {
                    showToast(`❌ Не удалось скопировать`, 'error');
                }
                document.body.removeChild(textarea);
            });
        }

        // ============================================================
        // ПОИСК
        // ============================================================
        function filterIcons() {
            const query = searchInput.value.toLowerCase().trim();
            if (!query) { renderIcons(allIcons); return; }
            const filtered = allIcons.filter(icon => icon.name.toLowerCase().includes(query));
            renderIcons(filtered);
        }

        // ============================================================
        // TOAST
        // ============================================================
        let toastTimeout;
        function showToast(message, type = 'success') {
            toast.textContent = message;
            toast.className = `toast ${type}`;
            clearTimeout(toastTimeout);
            requestAnimationFrame(() => toast.classList.add('show'));
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ============================================================
        // ЗАПУСК
        // ============================================================
        loadIcons();
    </script>
</body>
</html>
