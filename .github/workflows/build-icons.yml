name: 🔄 Автоматическое обновление иконок

on:
  # Запускается при изменении в папке icons или в скрипте
  push:
    paths:
      - 'icons/**'
      - 'generate.js'
      - 'package.json'
  
  # Или по расписанию (раз в день)
  schedule:
    - cron: '0 0 * * *'
  
  # Можно запустить вручную из интерфейса GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Клонируем репозиторий
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      # 2. Устанавливаем Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      # 3. Устанавливаем зависимости (если нужны)
      - name: 📦 Install dependencies
        run: |
          npm install || echo "Нет зависимостей"
          
      # 4. Запускаем генерацию HTML
      - name: 🛠️ Generate index.html
        run: node generate.js
        
      # 5. Коммитим изменения
      - name: 📤 Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "🔄 Автоматическое обновление иконок"
          git push
